name: Upstream compatibility

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-compatibility
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { checkUpstream } = require("./scripts/check-upstream.ts");
            await checkUpstream(github, context.repo);
