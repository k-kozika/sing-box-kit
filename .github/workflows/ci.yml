name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "22.13.0"
          run-install: false
      - name: Check the release tag
        if: github.ref_type == 'tag'
        run: |
          version=$(bun -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The release tag must match package.json (expected v$version)."
            exit 1
          fi
      - run: vp install --frozen-lockfile
      - run: bun run schema:generate
      - run: git diff --exit-code -- src/generated
      - run: vp check
      - run: bun test
      - name: Check representative configurations with pinned sing-box
        run: |
          version=$(bun -p 'require("./schema/version.json").version')
          asset="sing-box-${version}-linux-amd64-glibc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/SagerNet/sing-box/releases/download/v${version}/${asset}.tar.gz" \
            --output "$RUNNER_TEMP/${asset}.tar.gz"
          mkdir "$RUNNER_TEMP/sing-box-bin"
          tar -xzf "$RUNNER_TEMP/${asset}.tar.gz" -C "$RUNNER_TEMP/sing-box-bin" \
            --strip-components=1 --wildcards '*/sing-box'
          SING_BOX="$RUNNER_TEMP/sing-box-bin/sing-box" bun tests/sing-box-check.ts
      - name: Test the packed package on Node.js
        run: |
          vp pm pack --out "$RUNNER_TEMP/sing-box-kit.tgz"
          node_path=$(node -p 'process.execPath')
          bun_path=$(bun -p 'process.execPath')
          consumer_dir=$(mktemp -d)
          cd "$consumer_dir"
          "$bun_path" add "$RUNNER_TEMP/sing-box-kit.tgz"
          "$node_path" --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import { createPrivateKey, X509Certificate } from "node:crypto";
          import { compile, endpoint, generate, outbound, service, validateConfig } from "sing-box-kit";

          const direct = outbound.direct({ tag: "direct" });
          assert.deepEqual(compile({ outbounds: [direct] }), {
            outbounds: [{ type: "direct", tag: "direct" }],
          });

          const tailscale = endpoint.tailscale({ tag: "tail", advertise_exit_node: true });
          const usbip = service.usbipServer({ provider: "dynamic" }).listen({ port: 0 });
          const config = compile({ endpoints: [tailscale], services: [usbip] });
          assert.equal(validateConfig(config), config);
          assert.deepEqual(config, {
            endpoints: [{ type: "tailscale", tag: "tail", advertise_exit_node: true }],
            services: [{ type: "usbip-server", provider: "dynamic", listen_port: 0 }],
          });

          const { privateKey, certificate } = await generate.tlsKeyPair("example.com");
          const parsed = new X509Certificate(certificate);
          assert.equal(parsed.checkHost("example.com", { subject: "never" }), "example.com");
          assert.ok(parsed.checkPrivateKey(createPrivateKey(privateKey)));
          assert.ok(parsed.verify(parsed.publicKey));
          const ech = await generate.echKeyPair("example.com");
          assert.match(ech.config, /^-----BEGIN ECH CONFIGS-----/);
          assert.match(ech.key, /^-----BEGIN ECH KEYS-----/);
          EOF
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: npm-package
          path: ${{ runner.temp }}/sing-box-kit.tgz
          if-no-files-found: error
          overwrite: true
